name: Auto-Track Developer Activity

on:
  push:
    branches: ['**']  # Track all branches
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]

jobs:
  track-commit:
    name: Track Commit Activity
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-tracking]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for commit details
      
      - name: Get commit details
        id: commit-info
        run: |
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"
          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${{ github.ref_name }}"
          
          # Extract commit type from message (feat, fix, chore, etc.)
          if echo "$COMMIT_MSG" | grep -qE "^(feat|feature):"; then
            COMMIT_TYPE="feature"
            LABEL_TYPE="enhancement"
          elif echo "$COMMIT_MSG" | grep -qE "^(fix|bugfix):"; then
            COMMIT_TYPE="bugfix"
            LABEL_TYPE="bug"
          elif echo "$COMMIT_MSG" | grep -qE "^(chore|maintenance):"; then
            COMMIT_TYPE="maintenance"
            LABEL_TYPE="maintenance"
          elif echo "$COMMIT_MSG" | grep -qE "^(docs|documentation):"; then
            COMMIT_TYPE="documentation"
            LABEL_TYPE="documentation"
          elif echo "$COMMIT_MSG" | grep -qE "^(refactor):"; then
            COMMIT_TYPE="refactor"
            LABEL_TYPE="refactor"
          elif echo "$COMMIT_MSG" | grep -qE "^(test|testing):"; then
            COMMIT_TYPE="test"
            LABEL_TYPE="testing"
          else
            COMMIT_TYPE="update"
            LABEL_TYPE="update"
          fi
          
          # Get changed files count
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | wc -l | tr -d ' ')
          
          # Get commit diff stats
          DIFF_STATS=$(git diff --shortstat ${{ github.event.before }} ${{ github.sha }} || echo "No stats available")
          
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "commit_url=$COMMIT_URL" >> $GITHUB_OUTPUT
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "commit_type=$COMMIT_TYPE" >> $GITHUB_OUTPUT
          echo "label_type=$LABEL_TYPE" >> $GITHUB_OUTPUT
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "diff_stats=$DIFF_STATS" >> $GITHUB_OUTPUT
      
      - name: Create tracking issue for commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const trackingRepo = '${{ vars.TRACKING_REPO }}' || '${{ github.repository }}';
            // Fallback to current repo if TRACKING_REPO not set
            const finalTrackingRepo = trackingRepo || '${{ github.repository }}';
            const [owner, repo] = finalTrackingRepo.split('/');
            
            const title = `[${steps.commit-info.outputs.repo_name}] Commit: ${steps.commit-info.outputs.commit_msg.split('\n')[0].substring(0, 100)}`;
            
            const body = `## 📝 Commit Activity Tracking
            
            **Repository:** \`${steps.commit-info.outputs.repo_name}\`
            **Branch:** \`${steps.commit-info.outputs.branch_name}\`
            **Commit SHA:** [\`${steps.commit-info.outputs.commit_sha.substring(0, 7)}\`](${steps.commit-info.outputs.commit_url})
            **Author:** ${steps.commit-info.outputs.commit_author}
            **Type:** ${steps.commit-info.outputs.commit_type}
            
            ### Commit Details
            \`\`\`
            ${steps.commit-info.outputs.commit_msg}
            \`\`\`
            
            ### Changes
            - **Files Changed:** ${steps.commit-info.outputs.changed_files}
            - **Stats:** ${steps.commit-info.outputs.diff_stats}
            
            ### Links
            - [View Commit](${steps.commit-info.outputs.commit_url})
            - [View Repository](https://github.com/${steps.commit-info.outputs.repo_name})
            
            ---
            *Automatically generated by GitHub Actions*`;
            
            const labels = [
              steps.commit-info.outputs.label_type,
              'automated',
              'commit',
              steps.commit-info.outputs.repo_name.split('/')[1] || 'tracking'
            ];
            
            try {
              const issue = await github.rest.issues.create({
                owner: owner,
                repo: repo,
                title: title,
                body: body,
                labels: labels.filter(Boolean)
              });
              
              console.log(`✅ Created tracking issue #${issue.data.number} in ${trackingRepo}`);
            } catch (error) {
              console.error('❌ Failed to create issue:', error.message);
              // Try to create labels if they don't exist
              for (const label of labels) {
                if (label) {
                  try {
                    await github.rest.issues.createLabel({
                      owner: owner,
                      repo: repo,
                      name: label,
                      color: this.getLabelColor(label)
                    });
                  } catch (e) {
                    // Label might already exist, ignore
                  }
                }
              }
              // Retry issue creation
              const issue = await github.rest.issues.create({
                owner: owner,
                repo: repo,
                title: title,
                body: body,
                labels: labels.filter(Boolean)
              });
              console.log(`✅ Created tracking issue #${issue.data.number} after creating labels`);
            }
            
            function getLabelColor(label) {
              const colors = {
                'enhancement': 'a2eeef',
                'bug': 'd73a4a',
                'documentation': '0075ca',
                'maintenance': '7057ff',
                'refactor': 'fbca04',
                'testing': '0e8a16',
                'update': '1d76db',
                'automated': 'ededed',
                'commit': 'c2e0c6',
                'pull-request': 'c5def5',
                'issue': 'f9d0c4'
              };
              return colors[label] || 'ededed';
            }

  track-pull-request:
    name: Track Pull Request Activity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get PR details
        id: pr-info
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_STATE="${{ github.event.action }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          REPO_NAME="${{ github.repository }}"
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          
          # Determine PR type from title
          if echo "$PR_TITLE" | grep -qE "^(feat|feature):"; then
            PR_TYPE="feature"
            LABEL_TYPE="enhancement"
          elif echo "$PR_TITLE" | grep -qE "^(fix|bugfix):"; then
            PR_TYPE="bugfix"
            LABEL_TYPE="bug"
          elif echo "$PR_TITLE" | grep -qE "^(chore|maintenance):"; then
            PR_TYPE="maintenance"
            LABEL_TYPE="maintenance"
          elif echo "$PR_TITLE" | grep -qE "^(docs|documentation):"; then
            PR_TYPE="documentation"
            LABEL_TYPE="documentation"
          elif echo "$PR_TITLE" | grep -qE "^(refactor):"; then
            PR_TYPE="refactor"
            LABEL_TYPE="refactor"
          else
            PR_TYPE="update"
            LABEL_TYPE="update"
          fi
          
          # Check if merged
          if [ "$PR_STATE" = "closed" ] && [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            PR_STATE="merged"
            LABEL_TYPE="${LABEL_TYPE},merged"
          fi
          
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_title=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "pr_author=$PR_AUTHOR" >> $GITHUB_OUTPUT
          echo "pr_state=$PR_STATE" >> $GITHUB_OUTPUT
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_body=$PR_BODY" >> $GITHUB_OUTPUT
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "base_branch=$BASE_BRANCH" >> $GITHUB_OUTPUT
          echo "head_branch=$HEAD_BRANCH" >> $GITHUB_OUTPUT
          echo "pr_type=$PR_TYPE" >> $GITHUB_OUTPUT
          echo "label_type=$LABEL_TYPE" >> $GITHUB_OUTPUT
      
      - name: Create tracking issue for PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const trackingRepo = '${{ vars.TRACKING_REPO }}' || '${{ github.repository }}';
            // Fallback to current repo if TRACKING_REPO not set
            const finalTrackingRepo = trackingRepo || '${{ github.repository }}';
            const [owner, repo] = finalTrackingRepo.split('/');
            
            const stateEmoji = {
              'opened': '🆕',
              'closed': '🔒',
              'merged': '✅',
              'reopened': '🔄'
            };
            
            const emoji = stateEmoji[steps.pr-info.outputs.pr_state] || '📝';
            const title = `${emoji} [${steps.pr-info.outputs.repo_name}] PR #${steps.pr-info.outputs.pr_number}: ${steps.pr-info.outputs.pr_title.substring(0, 80)}`;
            
            const body = `## 🔀 Pull Request Activity Tracking
            
            **Repository:** \`${steps.pr-info.outputs.repo_name}\`
            **PR #${steps.pr-info.outputs.pr_number}** - **${steps.pr-info.outputs.pr_state.toUpperCase()}**
            **Author:** @${steps.pr-info.outputs.pr_author}
            **Type:** ${steps.pr-info.outputs.pr_type}
            
            ### PR Details
            **Title:** ${steps.pr-info.outputs.pr_title}
            
            **Description:**
            ${steps.pr-info.outputs.pr_body || '*No description provided*'}
            
            ### Branch Information
            - **Base Branch:** \`${steps.pr-info.outputs.base_branch}\`
            - **Head Branch:** \`${steps.pr-info.outputs.head_branch}\`
            
            ### Links
            - [View Pull Request](${steps.pr-info.outputs.pr_url})
            - [View Repository](https://github.com/${steps.pr-info.outputs.repo_name})
            
            ---
            *Automatically generated by GitHub Actions*`;
            
            const labels = [
              ...steps.pr-info.outputs.label_type.split(','),
              'automated',
              'pull-request',
              steps.pr-info.outputs.repo_name.split('/')[1] || 'tracking'
            ];
            
            try {
              const issue = await github.rest.issues.create({
                owner: owner,
                repo: repo,
                title: title,
                body: body,
                labels: labels.filter(Boolean)
              });
              
              console.log(`✅ Created tracking issue #${issue.data.number} in ${trackingRepo}`);
            } catch (error) {
              console.error('❌ Failed to create issue:', error.message);
              // Create labels if they don't exist
              for (const label of labels) {
                if (label) {
                  try {
                    await github.rest.issues.createLabel({
                      owner: owner,
                      repo: repo,
                      name: label,
                      color: this.getLabelColor(label)
                    });
                  } catch (e) {
                    // Label might already exist
                  }
                }
              }
              // Retry
              const issue = await github.rest.issues.create({
                owner: owner,
                repo: repo,
                title: title,
                body: body,
                labels: labels.filter(Boolean)
              });
              console.log(`✅ Created tracking issue #${issue.data.number}`);
            }
            
            function getLabelColor(label) {
              const colors = {
                'enhancement': 'a2eeef',
                'bug': 'd73a4a',
                'documentation': '0075ca',
                'maintenance': '7057ff',
                'refactor': 'fbca04',
                'testing': '0e8a16',
                'update': '1d76db',
                'merged': '6f42c1',
                'automated': 'ededed',
                'commit': 'c2e0c6',
                'pull-request': 'c5def5',
                'issue': 'f9d0c4'
              };
              return colors[label] || 'ededed';
            }

  track-issue:
    name: Track Issue Activity
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Get issue details
        id: issue-info
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_AUTHOR="${{ github.event.issue.user.login }}"
          ISSUE_STATE="${{ github.event.action }}"
          ISSUE_URL="${{ github.event.issue.html_url }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          REPO_NAME="${{ github.repository }}"
          
          # Determine issue type from labels or title
          if echo "$ISSUE_TITLE" | grep -qE "(bug|fix|error|issue)"; then
            ISSUE_TYPE="bug"
            LABEL_TYPE="bug"
          elif echo "$ISSUE_TITLE" | grep -qE "(feature|enhancement|improvement)"; then
            ISSUE_TYPE="feature"
            LABEL_TYPE="enhancement"
          else
            ISSUE_TYPE="issue"
            LABEL_TYPE="question"
          fi
          
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "issue_title=$ISSUE_TITLE" >> $GITHUB_OUTPUT
          echo "issue_author=$ISSUE_AUTHOR" >> $GITHUB_OUTPUT
          echo "issue_state=$ISSUE_STATE" >> $GITHUB_OUTPUT
          echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT
          echo "issue_body=$ISSUE_BODY" >> $GITHUB_OUTPUT
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "issue_type=$ISSUE_TYPE" >> $GITHUB_OUTPUT
          echo "label_type=$LABEL_TYPE" >> $GITHUB_OUTPUT
      
      - name: Create tracking issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const trackingRepo = '${{ vars.TRACKING_REPO }}' || '${{ github.repository }}';
            // Fallback to current repo if TRACKING_REPO not set
            const finalTrackingRepo = trackingRepo || '${{ github.repository }}';
            const [owner, repo] = finalTrackingRepo.split('/');
            
            // Skip if this is already in the tracking repo
            if (trackingRepo === github.repository) {
              console.log('⏭️  Skipping - this is the tracking repo itself');
              return;
            }
            
            const stateEmoji = {
              'opened': '🆕',
              'closed': '✅',
              'reopened': '🔄'
            };
            
            const emoji = stateEmoji[steps.issue-info.outputs.issue_state] || '📋';
            const title = `${emoji} [${steps.issue-info.outputs.repo_name}] Issue #${steps.issue-info.outputs.issue_number}: ${steps.issue-info.outputs.issue_title.substring(0, 80)}`;
            
            const body = `## 📋 Issue Activity Tracking
            
            **Repository:** \`${steps.issue-info.outputs.repo_name}\`
            **Issue #${steps.issue-info.outputs.issue_number}** - **${steps.issue-info.outputs.issue_state.toUpperCase()}**
            **Author:** @${steps.issue-info.outputs.issue_author}
            **Type:** ${steps.issue-info.outputs.issue_type}
            
            ### Issue Details
            **Title:** ${steps.issue-info.outputs.issue_title}
            
            **Description:**
            ${steps.issue-info.outputs.issue_body || '*No description provided*'}
            
            ### Links
            - [View Issue](${steps.issue-info.outputs.issue_url})
            - [View Repository](https://github.com/${steps.issue-info.outputs.repo_name})
            
            ---
            *Automatically generated by GitHub Actions*`;
            
            const labels = [
              steps.issue-info.outputs.label_type,
              'automated',
              'issue',
              steps.issue-info.outputs.repo_name.split('/')[1] || 'tracking'
            ];
            
            try {
              const issue = await github.rest.issues.create({
                owner: owner,
                repo: repo,
                title: title,
                body: body,
                labels: labels.filter(Boolean)
              });
              
              console.log(`✅ Created tracking issue #${issue.data.number} in ${trackingRepo}`);
            } catch (error) {
              console.error('❌ Failed to create issue:', error.message);
              // Create labels if needed
              for (const label of labels) {
                if (label) {
                  try {
                    await github.rest.issues.createLabel({
                      owner: owner,
                      repo: repo,
                      name: label,
                      color: this.getLabelColor(label)
                    });
                  } catch (e) {
                    // Label might already exist
                  }
                }
              }
              // Retry
              const issue = await github.rest.issues.create({
                owner: owner,
                repo: repo,
                title: title,
                body: body,
                labels: labels.filter(Boolean)
              });
              console.log(`✅ Created tracking issue #${issue.data.number}`);
            }
            
            function getLabelColor(label) {
              const colors = {
                'enhancement': 'a2eeef',
                'bug': 'd73a4a',
                'documentation': '0075ca',
                'maintenance': '7057ff',
                'refactor': 'fbca04',
                'testing': '0e8a16',
                'update': '1d76db',
                'question': 'd876e3',
                'automated': 'ededed',
                'commit': 'c2e0c6',
                'pull-request': 'c5def5',
                'issue': 'f9d0c4'
              };
              return colors[label] || 'ededed';
            }
