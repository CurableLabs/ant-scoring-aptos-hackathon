<!DOCTYPE html>
<html>
<head>
    <title>Autopopulation Debug Test</title>
</head>
<body>
    <h1>🧪 Debug Autopopulation Test</h1>
    
    <select id="molecule-select" onchange="loadExample()">
        <option value="">-- Choose Your Contestant --</option>
        <option value="tozadenant">🚀 Tozadenant (Parkinson's Innovation)</option>
        <option value="aspirin">💊 Aspirin (Pain Relief Classic)</option>
    </select>
    
    <br><br>
    
    <label>Name:</label>
    <input type="text" id="molecule-name" placeholder="Molecule name">
    <br><br>
    
    <label>SMILE ID:</label>
    <input type="text" id="smile-id" placeholder="SMILE structure">
    <br><br>
    
    <label>PDF:</label>
    <input type="text" id="pdf-input" placeholder="PDF reference">
    
    <div id="debug-log"></div>

    <script>
        function loadExample() {
            console.log('🧪 loadExample() called');
            
            const select = document.getElementById('molecule-select');
            const value = select.value;
            console.log('🧪 Selected value:', value);
            
            const examples = {
                'tozadenant': {
                    name: 'Tozadenant Parkinson\'s Innovation',
                    smile: 'C1=CN=C(N=C1N2CCN(CC2)C(=O)C3=CC4=C(C=C3)N=CN4C)N',
                    disease: 'Parkinson\'s Disease',
                    pdf: 'Tozadenant-Parkinsons-Innovation-2024.pdf'
                },
                'aspirin': {
                    name: 'Aspirin Pain Relief',
                    smile: 'CC(=O)OC1=CC=CC=C1C(=O)O',
                    disease: 'Cardiovascular',
                    pdf: 'Aspirin-Cardiovascular-Study-2024.pdf'
                }
            };
            
            console.log('🧪 Examples object:', examples);
            console.log('🧪 Looking for:', value);
            console.log('🧪 Found example:', examples[value]);
            
            if (examples[value]) {
                console.log('🧪 Setting values...');
                document.getElementById('molecule-name').value = examples[value].name;
                document.getElementById('smile-id').value = examples[value].smile;
                document.getElementById('pdf-input').value = examples[value].pdf;
                
                document.getElementById('debug-log').innerHTML = `
                    <h3>✅ Success!</h3>
                    <p>Name: ${examples[value].name}</p>
                    <p>SMILE: ${examples[value].smile}</p>
                    <p>PDF: ${examples[value].pdf}</p>
                `;
                
                console.log('✅ Values set successfully');
            } else if (value === '') {
                document.getElementById('molecule-name').value = '';
                document.getElementById('smile-id').value = '';
                document.getElementById('pdf-input').value = '';
                document.getElementById('debug-log').innerHTML = '<p>Cleared selection</p>';
                console.log('🧪 Values cleared');
            } else {
                document.getElementById('debug-log').innerHTML = `<p>❌ No example found for: ${value}</p>`;
                console.log('❌ No example found for:', value);
            }
        }
        
        console.log('🧪 Debug script loaded');
    </script>
</body>
</html>
